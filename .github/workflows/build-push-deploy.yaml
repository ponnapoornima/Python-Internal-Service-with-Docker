name: Deploy Python Internal Service to VM

on:
  push:
    branches:
      - developer   # change to your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Copy project to remote VM and run deployment
      - name: Deploy to VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}               # e.g., 20.197.0.254
          username: ${{ secrets.VM_USER }}           # e.g., azureuser
          key: ${{ secrets.VM_PEM_KEY }}             # private key contents
          port: 22
          script: |
            # Navigate to home directory
            cd ~

            # Clone repo (skip if folder exists)
            if [ ! -d "Internal-Python-Service" ]; then
              git clone https://github.com/CleavelandPrice-3KT/Internal-Python-Service.git
            fi

            cd Internal-Python-Service

            # Pull latest changes
            git fetch --all
            git reset --hard origin/developer

            # Update system and install dependencies
            sudo apt update
            sudo apt install -y python3 python3-venv python3-pip git

            # Create virtual environment
            python3 -m venv venv

            # Activate virtual environment
            source venv/bin/activate

            # Install Python requirements
            pip install --upgrade pip
            pip install -r requirements.txt

            # Run the application
            nohup python main.py > app.log 2>&1 &
