name: Deploy Python Internal Service to VM

on:
  push:
    branches:
      - developer   # Change to your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy and Configure Polling Service on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            VM_USER="${{ secrets.VM_USER }}"
            APP_DIR="/home/$VM_USER/python-internal-service"
            SERVICE_FILE="/etc/systemd/system/python-polling.service"

            cd /home/$VM_USER

            # Clone repo if missing (HTTPS + PAT)
            if [ ! -d "python-internal-service" ]; then
              git clone https://${{ secrets.PAT }}@github.com/ponnapoornima/python-internal-service.git python-internal-service
            fi

            cd python-internal-service

            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/developer

            echo "📦 Installing system packages..."
            sudo apt update
            sudo apt install -y python3 python3-venv python3-pip git

            echo "🐍 Setting up Python virtual environment..."
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            echo "📥 Installing Python dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "🔐 Creating .env file from GitHub Secrets..."
            cat > .env <<-EOF
              MSSQL_HOST=${{ secrets.MSSQL_HOST }}
              MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}
              MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}
              MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}

              EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}

              POLL_INTERVAL_SECONDS=5
              MAX_CONCURRENT_JOBS=3
              REQUEST_TIMEOUT_SECONDS=120
              MAX_RETRIES=3
              RETRY_DELAY_SECONDS=5.0

              APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}

              LOG_LEVEL=INFO
              LOG_FILE=logs/service.log
            EOF

            chmod 600 .env

            echo "🔧 Creating systemd service..."
            sudo tee $SERVICE_FILE > /dev/null <<EOF
            [Unit]
            Description=Python Internal Polling Service
            After=network.target

            [Service]
            User=$VM_USER
            WorkingDirectory=$APP_DIR
            ExecStart=$APP_DIR/venv/bin/python main.py
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            echo "🔄 Reloading systemd and starting service..."
            sudo systemctl daemon-reload
            sudo systemctl enable python-polling.service
            sudo systemctl restart python-polling.service

            echo "📄 Polling service status (last 50 lines):"
            sudo journalctl -u python-polling.service -n 50 --no-pager

            echo "✅ Deployment completed successfully!"
