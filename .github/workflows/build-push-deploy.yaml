name: Deploy and Verify Python Internal Polling Service to VM

on:
  push:
    branches:
      - developer

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy Python Polling Service on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            VM_USER="${{ secrets.VM_USER }}"
            APP_DIR="/home/$VM_USER/python-internal-service"
            SERVICE_FILE="/etc/systemd/system/python-polling.service"

            cd /home/$VM_USER

            if [ ! -d "python-internal-service" ]; then
              git clone https://${{ secrets.PAT }}@github.com/ponnapoornima/python-internal-service.git python-internal-service
            fi

            cd python-internal-service

            echo "Pulling latest code..."
            git fetch --all
            git reset --hard origin/developer

            echo "Installing system packages..."
            sudo apt update
            sudo apt install -y python3 python3-venv python3-pip git

            echo "Setting up virtual environment..."
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            echo "Installing dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "Creating logs directory..."
            mkdir -p logs

            echo "Creating .env file..."
            cat > .env <<EOF
            MSSQL_HOST=${{ secrets.MSSQL_HOST }}
            MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}
            MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}
            MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}
            EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}
            POLL_INTERVAL_SECONDS=5
            MAX_CONCURRENT_JOBS=3
            REQUEST_TIMEOUT_SECONDS=120
            MAX_RETRIES=3
            RETRY_DELAY_SECONDS=5.0
            APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}
            LOG_LEVEL=INFO
            LOG_FILE=logs/service.log
            EOF
            
            chmod 600 .env

            echo "Creating systemd service if not exists..."
            if [ ! -f "$SERVICE_FILE" ]; then
              sudo tee $SERVICE_FILE > /dev/null <<EOF
[Unit]
Description=Python Internal Polling Service
After=network.target

[Service]
User=$VM_USER
WorkingDirectory=$APP_DIR
ExecStart=$APP_DIR/venv/bin/python main.py
Restart=always
RestartSec=5
Environment=PYTHONUNBUFFERED=1

[Install]
WantedBy=multi-user.target
EOF
              sudo systemctl daemon-reload
              sudo systemctl enable python-polling.service
            fi

            echo "Fixing permissions..."
            sudo chown -R $VM_USER:$VM_USER $APP_DIR

            echo "Starting / Restarting service..."
            sudo systemctl daemon-reload
            sudo systemctl restart python-polling.service || true

            sleep 5

            echo "Checking service immediately..."
            if systemctl is-active --quiet python-polling.service; then
              echo "Service is running"
            else
              echo "Service failed — logs below"
              sudo journalctl -u python-polling.service -n 50 --no-pager
              exit 1
            fi

      - name: Verify Python Polling Service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            SERVICE_NAME="python-polling.service"

            echo "======================================"
            echo "Checking if service is running..."
            echo "======================================"

            if systemctl is-active --quiet $SERVICE_NAME; then
              echo "Service is RUNNING"
            else
              echo "Service is NOT running"
              exit 1
            fi

            echo ""
            echo "======================================"
            echo "Service Status"
            echo "======================================"
            sudo systemctl status $SERVICE_NAME --no-pager

            echo ""
            echo "======================================"
            echo "Last 30 Polling Logs"
            echo "======================================"
            sudo journalctl -u $SERVICE_NAME -n 30 --no-pager

            echo ""
            echo "======================================"
            echo "Verification Completed"
            echo "======================================"
```
