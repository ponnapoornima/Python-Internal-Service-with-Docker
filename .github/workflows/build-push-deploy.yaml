name: Deploy Python Internal Service to VM

on:
  push:
    branches:
      - developer   # change to your deployment branch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # avoid Node.js 20 deprecation warning

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Deploy to VM over SSH
      - name: Deploy to VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}           # VM public IP
          username: ${{ secrets.VM_USER }}       # VM SSH user
          key: ${{ secrets.SSH_PRIVATE_KEY }}    # Private key contents
          port: 22
          script: |
            # Navigate to home
            cd ~

            # Clone repo if not exists
            if [ ! -d "Internal-Python-Service" ]; then
              git clone https://github.com/CleavelandPrice-3KT/Internal-Python-Service.git
            fi

            cd Internal-Python-Service

            # Reset to latest developer branch
            git fetch --all
            git reset --hard origin/developer

            # Update system and install dependencies
            sudo apt update
            sudo apt install -y python3 python3-venv python3-pip git

            # Create virtual environment if not exists
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Activate virtual environment
            source venv/bin/activate

            # Upgrade pip and install requirements
            pip install --upgrade pip
            pip install -r requirements.txt

            # Kill any existing Python service process
            pkill -f main.py || true

            # Start the service in background and log output
            nohup python main.py > app.log 2>&1 &

            # Print confirmation
            echo "Deployment complete. Current running process:"
            pgrep -fl main.py
