name: Deploy Python Internal Service to VM

on:
  push:
    branches:
      - developer  # change to your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Deploy to VM via SSH
      - name: Deploy to VM
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting deployment..."

            cd /home/${{ secrets.VM_USER }}

            # Clone or update repo
            if [ ! -d "python-internal-service" ]; then
              git clone git@github.com:CleavelandPrice-3KT/Automated-DCR-Backend-Service.git python-internal-service
            fi
            cd python-internal-service
            git pull origin main

            # Install dependencies
            sudo apt update && sudo apt install -y python3 python3-venv python3-pip git

            # Setup virtual environment
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Create .env using secrets
            cat > .env <<EOF
            echo "🔐 Creating .env file with GitHub Secrets..."
            cat > .env <<EOF
# ============================================================
# Python Internal Service — Environment Configuration
# ============================================================

# SQL Server
MSSQL_HOST=${{secrets.MSSQL_HOST}}
MSSQL_DATABASE=${{secrets.MSSQL_DATABASE}}
MSSQL_USERNAME=${{secrets.MSSQL_USERNAME}}
MSSQL_PASSWORD=${{secrets.MSSQL_PASSWORD}}

# External API
EXTERNAL_API_BASE_URL=${{secrets.EXTERNAL_API_BASE_URL}}

# Polling / Service Behaviour
POLL_INTERVAL_SECONDS=5
MAX_CONCURRENT_JOBS=3
REQUEST_TIMEOUT_SECONDS=120
MAX_RETRIES=3
RETRY_DELAY_SECONDS=5.0

# APIM Subscription Key
APIM_SUBSCRIPTION_KEY=${{secrets.APIM_SUBSCRIPTION_KEY}}

# Logging
LOG_LEVEL=INFO
LOG_FILE=logs/service.log
EOF

            chmod 600 .env
