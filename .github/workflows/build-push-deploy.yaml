name: Deploy and Verify Python Internal Polling Service to VM

on:
  push:
    branches:
      - developer   # Change to your deployment branch

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Deploy Python Polling Service on VM
      - name: Deploy Python Polling Service on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            VM_USER="${{ secrets.VM_USER }}"
            APP_DIR="/home/$VM_USER/python-internal-service"

            cd /home/$VM_USER

            # Clone repo if missing using HTTPS + PAT
            if [ ! -d "python-internal-service" ]; then
              git clone https://${{ secrets.PAT }}@github.com/ponnapoornima/python-internal-service.git python-internal-service
            fi

            cd python-internal-service

            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/developer

            echo "📦 Installing system packages..."
            sudo apt update
            sudo apt install -y python3 python3-venv python3-pip git

            echo "🐍 Setting up Python virtual environment..."
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            echo "📥 Installing Python dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "🔐 Creating .env file from GitHub Secrets..."
            cat > .env <<-EOF
              MSSQL_HOST=${{ secrets.MSSQL_HOST }}
              MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}
              MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}
              MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}

              EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}

              POLL_INTERVAL_SECONDS=5
              MAX_CONCURRENT_JOBS=3
              REQUEST_TIMEOUT_SECONDS=120
              MAX_RETRIES=3
              RETRY_DELAY_SECONDS=5.0

              APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}

              LOG_LEVEL=INFO
              LOG_FILE=logs/service.log
            EOF

            chmod 600 .env

            echo "🔄 Starting Python polling service in background (if not already running)..."
            # Start the service if not running
            pgrep -f main.py || nohup python3 main.py > service.log 2>&1 &

      # Step 3: Verify service is running
      - name: Verify Python Polling Service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            SERVICE_NAME="python-polling.service"

            echo "📄 Checking if $SERVICE_NAME is running..."
            sudo systemctl is-active --quiet $SERVICE_NAME
            if [ $? -eq 0 ]; then
              echo "✅ $SERVICE_NAME is running!"
            else
              echo "❌ $SERVICE_NAME is not running!"
              exit 1
            fi

            echo "📄 Last 50 lines of service logs:"
            sudo journalctl -u $SERVICE_NAME -n 50 --no-pager
